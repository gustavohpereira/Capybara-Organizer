version: '3.8'
services:
  # Serviço para a API Express
  backend:
    build: ./back
    ports:
      - '8080:8080'
    environment:
      - DATABASE_URL=postgres://user:password@database:5432/dbname
      - JWT_SECRET=secret
      - PORT=8080
    depends_on:
      - database

  # Serviço para o banco de dados PostgreSQL
  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Serviço para o front-end Next.js
  frontend:
    build: ./front
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
